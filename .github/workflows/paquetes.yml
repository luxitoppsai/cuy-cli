name: Preparar paquetes compilados
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versión fija de la distribución
        required: true
      presupuesto:
        description: Presupuesto mensual aprobado para la distribución
        default: '10'
        required: true
permissions:
  contents: read
jobs:
  paquete:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      CUY_BUILD_PRESUPUESTO_USD: ${{ inputs.presupuesto }}
      OPENCODE_VERSION: ${{ inputs.version }}
      OPENCODE_CHANNEL: cuycli
      OPENCODE_RELEASE: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: python -m pip install -r requirements-build.txt
      - run: bun install --frozen-lockfile
        working-directory: vendor/opencode
      - run: bun run script/build.ts --single --skip-embed-web-ui --skip-install
        working-directory: vendor/opencode/packages/opencode
      - name: Empaquetar y probar ejecutables nativos
        run: python scripts/validar_paquete_ci.py
      - uses: actions/upload-artifact@v4
        with:
          name: cuy-${{ inputs.version }}-${{ matrix.os }}
          path: |
            dist-release/*.zip
            dist-release/*.json
            dist-release/cuy-instalar-*.exe
          if-no-files-found: error
